<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FCFAF8" />
    <title>Heidi · Screen library</title>
    <link rel="icon" href="./assets/heidi-symbol-bark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/tokens.css?v=release-20261006-labels" />
    <link rel="stylesheet" href="./styles.css?v=release-20261006-labels" />
    <link rel="stylesheet" href="./mobile-design-system.css?v=release-20261006-labels" />
    <link rel="stylesheet" href="./assets/heidi-component-utilities.css?v=release-20261006-labels" />
    <link rel="stylesheet" href="./session-components.css?v=release-20261006-labels" />
    <script defer src="./assets/heidi-components.js?v=release-20261006-labels"></script>
    <script defer src="./assets/lucide.min.js?v=release-20261006-labels"></script>
    <script defer src="./app.js?v=release-20261006-labels"></script>
    <script defer src="./screen-library.js?v=release-20261006-labels"></script>
    <script defer src="./device-preview.js?v=release-20261006-labels"></script>
  </head>
  <body class="has-site-nav">
    <nav class="site-nav" aria-label="CareOS site"><strong>CareOS</strong><a href="https://crosengard1.github.io/cara-heidi/">Requirements</a><a href="./?view=prototype" data-site-tab="prototype" aria-current="page">Prototype</a><a href="./?view=ideas" data-site-tab="ideas">Ideas</a><a href="./data-model.html">Data model</a><span>Interactive preview</span></nav>
    <div class="demo-shell">
      <aside id="screenLibrary" class="screen-library" aria-label="Screen library">
        <header class="library-header"><div class="library-brand"><img src="./assets/heidi-symbol-bark.svg" alt="" /><span>Heidi</span></div><button type="button" class="library-close" aria-label="Hide screen library" data-action="toggle-library">×</button></header>
        <div class="library-title">Screen library <span id="libraryCount"></span></div>
        <input id="librarySearch" class="library-search" type="search" placeholder="Find a screen…" aria-label="Find a screen" />
        <nav id="libraryScreens" class="library-screens" aria-label="Prototype screens"></nav>
        <footer class="library-footer">Mobile · Light theme <span>Local prototype · Example data</span></footer>
      </aside>
      <button type="button" class="library-backdrop" data-action="toggle-library" aria-label="Close screen library" hidden></button>
      <main class="device-stage">
        <div class="preview-toolbar"><button id="libraryToggle" class="library-toggle" type="button" data-action="toggle-library" aria-controls="screenLibrary" aria-expanded="true">Screens</button><span id="previewLocation" class="preview-location">Today / Appointments</span><span class="preview-dimensions" title="iPhone 14 Pro logical screen size">393 × 852</span></div>
        <div class="concept-toolbar" hidden><label for="homeConceptSelect">Home direction</label><select id="homeConceptSelect" aria-label="Home direction"><optgroup label="Current direction"><option value="apps">My day · Apps-owned</option></optgroup><optgroup label="Earlier explorations"><option value="balanced">Patients, work & review</option><option value="agents">Ready for you</option><option value="rhythm">Your day</option><option value="patient">This patient, then next</option><option value="delegated">Heidi is taking care of</option><option value="capture">Get it out of your head</option><option value="visit">Finish this visit</option><option value="leave">Leave today well</option><option value="now">Pick up where you are</option></optgroup></select><span id="homeDependency">Existing prototype</span><label id="homeAgentControl" hidden><input type="checkbox" id="homeAgentToggle" checked /> Agent examples</label></div>
        <div class="device-viewport">
          <div class="phone-frame">
            <div class="phone-screen">
              <div class="phone-status" aria-hidden="true"><span>9:41</span><span class="dynamic-island"></span><span class="status-icons">●●● ▰</span></div>
              <div id="app" class="app-root"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
